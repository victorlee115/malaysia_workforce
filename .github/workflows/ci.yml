name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
      - run: python -m compileall -q malaysia_workforce
      - run: npm run check:js
      - run: rm -rf .pytest_cache && find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: python scripts/verify_release.py
      - name: Verify the exact Git archive
        run: python scripts/verify_release.py --git-archive

  live-bench:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pfrappe"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Bench prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev
          python -m pip install --upgrade pip frappe-bench
          npm install --global yarn
      - name: Build the pinned Frappe v16 site
        run: |
          bench init --no-backups --skip-redis-config-generation --frappe-branch v16.19.0 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench get-app --branch v16.20.0 erpnext https://github.com/frappe/erpnext
          bench get-app --branch v16.7.1 hrms https://github.com/frappe/hrms
          bench get-app "$GITHUB_WORKSPACE"
          bench new-site test.localhost --db-root-password frappe --admin-password admin --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app malaysia_workforce
          bench --site test.localhost set-config allow_tests true
      - name: Prove idempotent migrate, build and live workflows
        working-directory: frappe-bench
        run: |
          bench --site test.localhost migrate
          bench --site test.localhost migrate
          bench build --app malaysia_workforce
          bench --site test.localhost run-tests --app malaysia_workforce
          bench --site test.localhost execute malaysia_workforce.diagnostics.assert_compatible_stack
          test "$(git -C apps/frappe rev-parse --short=7 HEAD)" = "ba18090"
          test "$(git -C apps/erpnext rev-parse --short=7 HEAD)" = "ff46d20"
          test "$(git -C apps/hrms rev-parse --short=7 HEAD)" = "fe9ad9d"
