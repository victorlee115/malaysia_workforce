name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q
      - run: python -m compileall -q malaysia_workforce
      - run: npm run check:js
      - run: rm -rf .pytest_cache && find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: python scripts/verify_release.py
